info:
  name: Obtener Calendario por Localidad
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:8080/api/schedules/district/1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Obtiene el calendario de recolección activo para una localidad.
  No requiere JWT (público).
  Reemplazar 1 con el districtId real.


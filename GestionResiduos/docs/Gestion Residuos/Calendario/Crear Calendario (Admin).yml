info:
  name: Crear Calendario (Admin)
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8080/api/schedules
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "districtId": 1,
        "residueType": "RECICLABLE",
        "dayOfWeek": "LUNES",
        "startTime": "06:00",
        "endTime": "12:00",
        "description": "Recolección de material reciclable zona norte"
      }
  auth:
    type: bearer
    token: "{{JWT}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Crea un nuevo calendario de recolección. Solo ADMINISTRADOR.
  residueType: ORGANICO, RECICLABLE, ESPECIAL, RCD
  dayOfWeek: LUNES, MARTES, MIERCOLES, JUEVES, VIERNES, SABADO, DOMINGO
  startTime/endTime: formato HH:mm


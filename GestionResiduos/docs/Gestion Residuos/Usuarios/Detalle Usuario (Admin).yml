info:
  name: Detalle Usuario (Admin)
  type: http
  seq: 5

http:
  method: GET
  url: http://localhost:8080/api/users/admin/999999999
  auth:
    type: bearer
    token: "{{JWT}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Obtiene el detalle completo de un usuario por su número de documento.
  Incluye: correo, ciudad, localidad, dirección, y todos los datos del perfil.
  Solo accesible para usuarios con rol ADMINISTRADOR.
  Requiere JWT en el header Authorization.
  Reemplazar 999999999 con el documentNumber real del usuario.


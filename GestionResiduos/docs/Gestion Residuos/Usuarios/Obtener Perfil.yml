info:
  name: Obtener Perfil
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:8080/api/users/profile
  auth:
    type: bearer
    token: "{{JWT}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Obtiene el perfil del usuario autenticado.
  Devuelve todos los datos personales + indicador "canUpdate" (true/false) y "nextUpdateAvailable" (fecha).
  Requiere JWT en el header Authorization.


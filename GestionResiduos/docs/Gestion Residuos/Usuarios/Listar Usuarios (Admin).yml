info:
  name: Listar Usuarios (Admin)
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:8080/api/users/admin/list
  auth:
    type: bearer
    token: "{{JWT}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Lista todos los usuarios con datos resumidos: foto, nombres, apellidos, estado, email.
  Solo accesible para usuarios con rol ADMINISTRADOR.
  Requiere JWT en el header Authorization.


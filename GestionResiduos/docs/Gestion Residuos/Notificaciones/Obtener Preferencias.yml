info:
  name: Obtener Preferencias
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:8080/api/notifications/preferences
  auth:
    type: bearer
    token: "{{JWT}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Obtiene las preferencias de notificación del usuario autenticado.
  Si no tiene preferencias, se crean las por defecto (todo activo, 18:00).
  Requiere JWT.


info:
  name: Historial Notificaciones
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:8080/api/notifications/history
  auth:
    type: bearer
    token: "{{JWT}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Obtiene el historial de notificaciones enviadas al usuario autenticado.
  Ordenado por fecha descendente.


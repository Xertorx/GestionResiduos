info:
  name: Obtener Distritos por Ciudad
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:8080/api/geography/districts?cityId={{cityId}}
  headers:
    - name: Accept
      value: application/json
  description: |
    Lista los distritos de una ciudad. Reemplaza {{cityId}} por el id de la ciudad.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


info:
  name: Obtener Barrio por ID
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:8080/api/geography/neighborhoods/{{neighborhoodId}}
  headers:
    - name: Accept
      value: application/json
  description: |
    Obtener los detalles de un barrio por su id. Reemplaza {{neighborhoodId}} por el id numérico.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


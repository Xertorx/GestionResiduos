info:
  name: Obtener Barrios por Distrito
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:8080/api/geography/neighborhoods?districtId={{districtId}}
  headers:
    - name: Accept
      value: application/json
  description: |
    Lista los barrios (neighborhoods) de un distrito. Reemplaza {{districtId}} por el id del distrito.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


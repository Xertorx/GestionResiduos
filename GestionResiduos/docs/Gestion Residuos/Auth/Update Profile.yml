info:
  name: Update Profile
  type: http
  seq: 6

http:
  method: PUT
  url: http://localhost:8080/auth/update-profile
  body:
    type: multipart-form
    data:
      - name: email
        type: text
        value: juanma25051@gmail.com
      - name: nickName
        type: text
        value: JuanMa
      - name: photo
        type: file
        value: []
  auth:
    type: bearer
    token: "{{JWT}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Actualiza apodo y foto de perfil.
  La foto se sube como archivo (ya no como base64).
  Se guarda en uploads/photo_profile/ y se retorna la URL relativa.
  El campo photo es opcional.


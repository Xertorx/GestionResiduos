info:
  name: Login admin
  type: http
  seq: 10

http:
  method: POST
  url: http://localhost:8080/auth/login
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "email":"admin@gestionresiduos.com",
          "password":"admin123"
          }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.body;

        // Guardar variable global
        bru.setEnvVar("JWT", data.accessToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

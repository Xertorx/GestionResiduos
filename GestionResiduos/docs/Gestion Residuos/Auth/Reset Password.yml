info:
  name: Reset Password
  type: http
  seq: 10

http:
  method: POST
  url: http://localhost:8080/auth/reset-password
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "token": "tu-token-de-reset-aqui",
        "newPassword": "NuevaPassword123*"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


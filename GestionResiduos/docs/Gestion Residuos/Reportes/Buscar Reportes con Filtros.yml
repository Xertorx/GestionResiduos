info:
  name: Buscar Reportes con Filtros
  type: http
  seq: 10

http:
  method: GET
  url: http://localhost:8080/api/reports/search?status=pendiente&type=punto_critico&dateFrom=2026-01-01&dateTo=2026-12-31&page=0&size=10
  auth:
    type: bearer
    token: "{{JWT}}"

params:
  query:
    - name: status
      value: pendiente
      enabled: true
    - name: type
      value: punto_critico
      enabled: false
    - name: dateFrom
      value: "2026-01-01"
      enabled: false
    - name: dateTo
      value: "2026-12-31"
      enabled: false
    - name: categoryId
      value: "1"
      enabled: false
    - name: page
      value: "0"
      enabled: true
    - name: size
      value: "10"
      enabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Búsqueda de reportes con filtros combinados y paginación.
  Todos los filtros son opcionales. Si no se envía ninguno, retorna todos paginados.
  
  Filtros disponibles:
  - status: pendiente, en_revision, resuelto, rechazado
  - type: punto_critico, incumplimiento_calendario
  - dateFrom: fecha inicio (formato YYYY-MM-DD)
  - dateTo: fecha fin (formato YYYY-MM-DD)
  - categoryId: ID de la categoría del reporte
  - page: número de página (default 0)
  - size: tamaño de página (default 10)
  
  Respuesta paginada con: content[], totalElements, totalPages, number, size.


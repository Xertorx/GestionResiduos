info:
  name: Obtener Contenidos Educativos
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:8080/api/v1/education
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

docs: "Obtiene la lista de todos los contenidos educativos. No requiere autenticación."

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


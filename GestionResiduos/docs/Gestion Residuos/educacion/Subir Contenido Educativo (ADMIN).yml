info:
  name: Subir Contenido Educativo (ADMIN)
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8080/api/v1/education
  body:
    type: form-data
    data:
      - name: title
        value: "Ejemplo Bruno"
      - name: description
        value: "Descripción de ejemplo"
      - name: category
        value: "General"
      - name: file
        value: "@/ruta/al/archivo.pdf"
        type: file
  auth:
    type: bearer
    token: "{{JWT}}"

docs: "Sube un nuevo contenido educativo. Requiere autenticación como ADMIN."

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


<div
  class="feature-card bg-white p-6 rounded-lg shadow transform transition-transform duration-300 hover:-translate-y-1 hover:shadow-xl relative pointer-events-auto"
>
  <div class="flex items-center">
    <div class="flex-shrink-0 bg-emerald-100 rounded-md p-3">
      <i [attr.data-lucide]="icon" class="h-6 w-6 text-emerald-600"></i>
    </div>
    <div class="ml-4">
      <h3 class="text-lg font-medium text-gray-900">{{ title }}</h3>
      <p class="mt-1 text-gray-600">{{ description }}</p>
    </div>
  </div>
</div>

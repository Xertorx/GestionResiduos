<!-- Modal de inicio de sesión -->

@if (visible) {
<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white rounded-xl p-12 w-full max-w-md">
    <div class="flex justify-between items-center mb-6">
      <h3 class="text-2xl font-bold text-gray-800">Iniciar Sesión</h3>
      <button (click)="onClose()" class="text-gray-500 hover:text-gray-700">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <form>
      <div class="mb-4">
        <label class="block text-gray-700 mb-2">Correo electrónico</label>
        <input type="email"
          class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 focus:border-green-500">
      </div>
      <div class="mb-6">
        <label class="block text-gray-700 mb-2">Contraseña</label>
        <input type="password"
          class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 focus:border-green-500">
      </div>
      <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-md hover:bg-green-700 transition mb-4">
        Ingresar
      </button>
      <div class="text-center">
        <a href="#" class="text-sm text-green-600 hover:text-green-800">¿Olvidaste tu contraseña?</a>
      </div>
       <div class="mt-6 flex flex-col items-center">
                <div class="flex items-center w-full">
                    <hr class="flex-grow border-gray-300">
                    <span class="px-2 text-gray-500">Ó</span>
                    <hr class="flex-grow border-gray-300">
                </div>

                <button
                    class="flex items-center justify-center w-full mt-4 bg-gray-200 py-2 rounded-md hover:bg-gray-300">
                    <img src="https://www.svgrepo.com/show/355037/google.svg" class="w-5 h-5 mr-2" />
                    <span class="px-2 text-black">Continua con Google</span>
                </button>
            </div>
    </form>

    <div class="mt-6 pt-6 border-t border-gray-200 flex justify-center items-center space-x-2">
      <p class="text-gray-600">¿No tienes una cuenta?</p>
      <a routerLink="/register" (click)="onClose()" class="text-sm text-green-600 hover:text-green-800">Regístrate aquí</a>
    </div>

  </div>
  <div id="recaptcha-badge"></div>
</div>
}
<!-- Modal de inicio de sesión -->

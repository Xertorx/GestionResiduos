<div class="py-12 bg-gray-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="lg:text-center">
      <p
        class="mt-2 text-3xl leading-8 font-extrabold tracking-tight text-gray-900 sm:text-4xl"
      >
        Todo lo que necesitas para gestionar residuos
      </p>
    </div>

    <div class="mt-10">
      <div class="grid grid-cols-1 gap-10 sm:grid-cols-2 lg:grid-cols-3">
        @for (card of cards; track card.title) {
          <a href="/">
          <div class="bg-white rounded-lg shadow p-6">
            <div
              class="flex items-center justify-center h-12 w-12 rounded-md bg-emerald-500 text-white"
            >
              <!-- Icono Lucide -->
              <lucide-icon [name]="card.icon" class="w-6 h-6"></lucide-icon>
            </div>
            <h3 class="mt-6 text-lg leading-6 font-medium text-gray-900">
              {{ card.title }}
            </h3>
            <p class="mt-4 text-base text-gray-500">
              {{ card.description }}
            </p>
          </div>
          </a>
        }
      </div>
    </div>
  </div>
</div>

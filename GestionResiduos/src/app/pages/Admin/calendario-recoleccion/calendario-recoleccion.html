<div class="bg-white rounded-lg shadow p-6">
  <h2 class="text-xl font-semibold mb-4">Calendario de Recolección</h2>
  <div class="space-y-3">
    @for (s of schedules; track s.id) {
      <div class="p-3 border rounded flex justify-between items-center">
        <div>
          <div class="font-medium">{{ s.sector }}</div>
          <div class="text-sm text-gray-500">{{ s.dia }} · {{ s.hora }}</div>
        </div>
        <div>
          <button class="text-emerald-600">Editar</button>
        </div>
      </div>
    }
  </div>
</div>

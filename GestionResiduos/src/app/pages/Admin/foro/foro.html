<div class="bg-white rounded-lg shadow p-6">
  <h2 class="text-xl font-semibold mb-4">Foro Comunitario (Admin)</h2>
  <div class="space-y-3">
    @for (t of temas; track t.id) {
      <div class="p-3 border rounded flex justify-between items-center">
        <div>
          <div class="font-medium">{{ t.titulo }}</div>
          <div class="text-sm text-gray-500">{{ t.comentarios }} comentarios</div>
        </div>
        <div>
          <button class="text-emerald-600">Ver</button>
        </div>
      </div>
    }
  </div>
</div>

<div class="bg-white rounded-lg shadow p-6">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-xl font-semibold">Eco-puntos</h2>
    <div>
      <button class="px-4 py-2 bg-emerald-600 text-white rounded">Nuevo punto</button>
    </div>
  </div>

  <div class="space-y-3">
    @for (p of puntos; track p.id) {
      <div class="p-3 border rounded flex justify-between items-center">
        <div>
          <div class="font-medium">{{ p.nombre }}</div>
          <div class="text-sm text-gray-500">{{ p.barrio }} · {{ p.direccion }}</div>
        </div>
        <div>
          <button class="text-emerald-600 mr-2" (click)="editar(p)">Editar</button>
          <button class="text-red-600" (click)="eliminar(p)">Eliminar</button>
        </div>
      </div>
    }
  </div>
</div>

<!-- Main Content -->
<div class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900 mb-2">
        Calendario de Recolección
      </h1>
      <p class="text-lg text-gray-600">
        Consulta los horarios y días de recolección en tu localidad
      </p>
    </div>

    <!-- Localidad Selector -->
    <div class="bg-white rounded-lg shadow-md p-6 mb-8">
      <div
        class="flex flex-col sm:flex-row sm:items-center sm:justify-between"
      >
        <div class="mb-4 sm:mb-0">
          <h2 class="text-lg font-medium text-gray-900">
            Selecciona tu localidad
          </h2>
          <p class="text-sm text-gray-600">
            Para ver el calendario específico de tu zona
          </p>
        </div>
        <div class="flex items-center gap-3">
          <div class="flex-1 sm:max-w-xs">
            <select
              [(ngModel)]="selectedDistrictId"
              (ngModelChange)="onDistrictChange()"
              class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
            >
              @for (d of districts; track d.id) {
                <option [ngValue]="d.id">{{ d.name }}</option>
              }
            </select>
          </div>
          @if (isLoadingSchedules) {
            <svg class="animate-spin h-5 w-5 text-emerald-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
            </svg>
          }
        </div>
      </div>
    </div>

    <!-- Calendar -->
    <div class="bg-white rounded-lg shadow-md p-6 mb-8">
      @if (calendarOptions) {
        <full-calendar [options]="calendarOptions"></full-calendar>
      } @else {
        <div class="flex justify-center items-center h-64">
          <p class="text-gray-500">Cargando calendario...</p>
        </div>
      }
    </div>

     

    <!-- Legend -->
    <div class="bg-white rounded-lg shadow-md p-6 mb-8">
      <h3 class="text-lg font-medium text-gray-900 mb-4">Leyenda</h3>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="flex items-center">
          <div
            class="w-4 h-4 bg-emerald-100 border-2 border-emerald-500 rounded mr-3"
          ></div>
          <span class="text-sm">Orgánico</span>
        </div>
        <div class="flex items-center">
          <div
            class="w-4 h-4 bg-blue-100 border-2 border-blue-500 rounded mr-3"
          ></div>
          <span class="text-sm">Reciclable</span>
        </div>
        <div class="flex items-center">
          <div
            class="w-4 h-4 bg-indigo-100 border-2 border-indigo-500 rounded mr-3"
          ></div>
          <span class="text-sm">Especial</span>
        </div>
        <div class="flex items-center">
          <div
            class="w-4 h-4 bg-amber-100 border-2 border-amber-500 rounded mr-3"
          ></div>
          <span class="text-sm">RCD</span>
        </div>
      </div>
    </div>

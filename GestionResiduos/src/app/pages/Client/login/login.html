<!-- Login Form -->
<div class="min-h-screen flex flex-col items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-lg shadow-md">
    <div class="text-center mb-12">
  <lucide-icon name="log-in" class="mx-auto h-12 w-12 text-emerald-600"></lucide-icon>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
        Iniciar sesión
      </h2>

    </div>
    <form class="mt-8 space-y-6" action="#" method="POST">
      <div class="rounded-md shadow-sm -space-y-px mb-12">
        <div class="mb-6">
          <label for="email" class="sr-only">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="email" required
            class="form-input relative block w-full rounded-t-md border-gray-300 px-3 py-2 text-gray-900 placeholder-gray-500 focus:z-10 focus:outline-none"
            placeholder="Correo electrónico" />
        </div>
        <div>
          <label for="password" class="sr-only">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required
            class="form-input relative block w-full rounded-b-md border-gray-300 px-3 py-2 text-gray-900 placeholder-gray-500 focus:z-10 focus:outline-none"
            placeholder="Contraseña" />
        </div>
      </div>

      <div class="flex items-center justify-between">
        <div class="flex items-center">
          <input id="remember-me" name="remember-me" type="checkbox"
            class="h-4 w-4 text-emerald-600 focus:ring-emerald-500 border-gray-300 rounded" />
          <label for="remember-me" class="ml-2 block text-sm text-gray-900">
            Recordarme
          </label>
        </div>

        <div class="text-sm">
          <a href="recuperar.html" class="font-medium text-emerald-600 hover:text-emerald-500">
            ¿Olvidaste tu contraseña?
          </a>
        </div>
      </div>

      <div>
        <button type="submit"
          class="btn-primary group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500">
          Iniciar sesión
        </button>
      </div>
      
    </form>
    <div class="mt-6">
        <div class="relative">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-300"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-2 bg-white text-gray-500">O </span>
          </div>
        </div>
      </div>
       <!-- Google Sign In -->
      <div class="mt-6">
        <button
          class="google-btn w-full flex items-center justify-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
          <lucide-icon name="chrome" class="h-5 w-5 text-blue-500 mr-2"></lucide-icon>
          Continuar con Google
        </button>
      </div>
  </div>
  <div class="mt-6">
  <p class="mt-2 text-center text-sm text-gray-600">
    ¿Aun no tienes una cuenta?
    <a [routerLink]="'/register'" class="font-medium text-emerald-600 hover:text-emerald-500">crea una cuenta nueva</a>
  </p>
</div>
</div>

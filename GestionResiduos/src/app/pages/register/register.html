<div class="flex justify-center items-center min-h-screen  mb-8">
    <div class="w-3/4 bg-white shadow-md rounded-lg p-10 flex mt-8">

        <!-- Columna izquierda: Formulario -->
        <div class="w-2/3 pr-10">
            <h3 class="text-2xl font-bold text-gray-800 mb-8">Registrarse</h3>

            <form class="grid grid-cols-2 gap-6">

                <!-- Nombres -->
                <div>
                    <label class="block text-gray-700 mb-2">Nombres</label>
                    <input type="text"
                        class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 focus:border-green-500" />
                </div>

                <!-- Apellidos -->
                <div>
                    <label class="block text-gray-700 mb-2">Apellidos</label>
                    <input type="text"
                        class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 focus:border-green-500" />
                </div>

                <!-- Tipo Documento -->
                <div>
                    <label class="block text-gray-700 mb-2">Tipo Documento</label>
                    <select
                        class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 focus:border-green-500">
                        <option>Selecciona un tipo de documento</option>
                    </select>
                </div>

                <!-- Número Documento -->
                <div>
                    <label class="block text-gray-700 mb-2">Número Documento</label>
                    <input type="text"
                        class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 focus:border-green-500" />
                </div>

                <!-- Correo -->
                <div>
                    <label class="block text-gray-700 mb-2">Correo Electrónico</label>
                    <input type="email"
                        class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 focus:border-green-500" />
                </div>

                <!-- Fecha Nacimiento -->
                <div>
                    <label class="block text-gray-700 mb-2">Fecha de Nacimiento</label>
                    <input type="date"
                        class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 focus:border-green-500" />
                </div>

                <!-- Ciudad -->
                <div>
                    <label class="block text-gray-700 mb-2">Ciudad</label>
                    <select
                        class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 focus:border-green-500">
                        <option>Selecciona una ciudad</option>
                    </select>
                </div>

                <!-- Localidad -->
                <div>
                    <label class="block text-gray-700 mb-2">Localidad</label>
                    <select
                        class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 focus:border-green-500">
                        <option>Selecciona una localidad</option>
                    </select>
                </div>

                <!-- Dirección (ocupa toda la fila) -->
                <div class="col-span-2">
                    <label class="block text-gray-700 mb-2">Dirección</label>
                    <input type="text"
                        class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 focus:border-green-500" />
                </div>

                <!-- Contraseña -->
                <div class="relative">
                    <label class="block text-gray-700 mb-2">Contraseña</label>
                    <input [type]="showPassword ? 'text' : 'password'"
                        class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 focus:border-green-500" />

                    <button type="button" class="absolute right-2 top-7 bottom-0 flex items-center justify-center"
                        (click)="showPassword = !showPassword">
                        <img [src]="showPassword ? '/img/icons/ojo_p.png' : '/img/icons/ojo.png'"
                            class="w-5 h-5" />
                    </button>
                </div>

                <!-- Confirmar Contraseña -->
                <div class="relative">
                    <label class="block text-gray-700 mb-2">Confirmar Contraseña</label>
                    <input [type]="showConfirmPassword ? 'text' : 'password'"
                        class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 focus:border-green-500" />

                    <button type="button" class="absolute right-2 top-7 bottom-0 flex items-center justify-center"
                        (click)="showConfirmPassword = !showConfirmPassword">
                        <img [src]="showConfirmPassword ? '/img/icons/ojo_p.png' : '/img/icons/ojo.png'"
                            class="w-5 h-5" />
                    </button>
                </div>

            </form>

            <!-- Google login -->
            <div class="mt-6 flex flex-col items-center">
                <div class="flex items-center w-full">
                    <hr class="flex-grow border-gray-300">
                    <span class="px-2 text-gray-500">Ó</span>
                    <hr class="flex-grow border-gray-300">
                </div>

                <button
                    
                    class="flex items-center justify-center w-full mt-4 bg-gray-200 py-2 rounded-md hover:bg-gray-300">
                    <img src="https://www.svgrepo.com/show/355037/google.svg" class="w-5 h-5 mr-2" />
                    <span>Continua con Google</span>
                </button>
            </div>

            <!-- Botón registrar -->
            <button type="submit"
                (click)="onRegister()"
                class="w-full bg-green-600 text-white py-2 mt-6 rounded-md hover:bg-green-700 transition">
                Registrarse
            </button>
        </div>

        <!-- Columna derecha: Logo -->
        <div class="w-1/3 flex flex-col items-center justify-center">
            <img src="/img/icons/Reciclaje.png" alt="Logo" class="w-40 h-40 mb-4">
            <h2 class="text-2xl font-bold text-green-600">EcoBolivar</h2>
        </div>
    </div>
</div>

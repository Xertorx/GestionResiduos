<div class="flex justify-center mb-8">
    <div class="w-3/4 bg-white shadow-md rounded-lg p-10 flex mt-8">

        <!-- Columna izquierda: Formulario -->
        <div class="w-2/3 pr-10  pb-12">
            <h3 class="text-2xl font-bold text-gray-800 mb-12">Completar Perfil</h3>
            <form class="grid grid-cols-2 gap-6 w-3/4 mx-auto pt-12 mt-12 mb-12" (ngSubmit)="onSubmit()">

                <!-- Apodo / Nombre -->
                <div class="flex flex-col">
                    <label class="block text-gray-700 mb-2">Ingresa un Apodo</label>
                    <input type="text" [(ngModel)]="nombre" name="nombre"
                        class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 focus:border-green-500" />
                </div>

                <!-- Foto -->
                <div class="flex flex-col">
                    <label class="block text-gray-700 mb-2">Ingresa una foto tuya</label>
                    <input type="file" (change)="onFileSelected($event)" accept="image/*"
                        class="border border-gray-300 rounded-md p-2 cursor-pointer" />
                </div>

                <!-- Preview circular centrada -->
                @if (preview) {

                <div class="col-span-2 flex flex-col items-center mt-6 mb-12">
                    <p class="mb-2 text-gray-700 font-medium">Previsualización de la imagen cargada</p>
                    <div class="w-40 h-40 rounded-full overflow-hidden border-2 border-gray-300">
                        <img [src]="preview" alt="Foto" class="w-full h-full object-cover">
                    </div>
                </div>
                }
                <!-- Botón Finalizar -->
                <div class="col-span-2 mt-6">
                    <button type="submit"
                        class="w-full bg-green-600 text-white py-2 rounded-md hover:bg-green-700 transition">
                        Finalizar
                    </button>
                </div>

            </form>
        </div>

        <!-- Columna derecha: Logo -->
        <div class="w-1/3 flex flex-col items-center justify-center">
            <img src="/img/icons/Reciclaje.png" alt="Logo" class="w-40 h-40 mb-4">
            <h2 class="text-2xl font-bold text-green-600">EcoBolivar</h2>
        </div>

    </div>
</div>
